<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mirrored LTR and RTL layout</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f7f8fa;
    --panel: #ffffff;
    --border: #cfd7df;
    --muted: #5b6773;
    --ink: #1f2933;
    --blue: #2158d6;
    --blue-soft: #edf3ff;
    --amber-soft: #fff5dd;
    --line: #d8dee6;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font: 16px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--ink);
    background: var(--bg);
  }

  main {
    max-width: 980px;
    margin: 0 auto;
    padding: 1rem;
  }

  h1 {
    margin: 0 0 0.35rem;
    font-size: 1.15rem;
  }

  .intro {
    margin: 0 0 1rem;
    color: var(--muted);
    font-size: 0.95rem;
  }

  .figure {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 1rem;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1rem;
    box-shadow: 0 8px 20px rgba(31, 41, 51, 0.06);
  }

  .panel-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 0 0 0.4rem;
    font-size: 0.82rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
  }

  .edge-note {
    display: flex;
    justify-content: space-between;
    margin: 0 0 0.8rem;
    font-size: 0.78rem;
    color: var(--muted);
  }

  .shell {
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    background: #fcfdff;
  }

  .shell-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.75rem;
    padding: 0.8rem 0.9rem;
    background: var(--blue-soft);
    border-bottom: 1px solid var(--line);
  }

  .logo {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    inline-size: 2.65rem;
    block-size: 1.15rem;
    border-radius: 999px;
    background: var(--blue);
    color: #fff;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.04em;
  }

  .header-copy {
    font-size: 0.85rem;
    font-weight: 600;
  }

  .shell-body {
    display: flex;
    min-height: 14rem;
  }

  .nav {
    inline-size: 34%;
    padding: 0.9rem 0.8rem;
    background: var(--amber-soft);
    border-inline-end: 1px solid var(--line);
  }

  .nav-title,
  .main-title,
  .crumb-title {
    margin: 0 0 0.6rem;
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--ink);
  }

  .nav-item,
  .line {
    display: block;
    block-size: 0.52rem;
    border-radius: 999px;
    background: #cdd7e1;
    margin-block-end: 0.45rem;
  }

  .nav-item:nth-child(2) { inline-size: 70%; }
  .nav-item:nth-child(3) { inline-size: 54%; }
  .nav-item:nth-child(4) { inline-size: 76%; }
  .nav-item:nth-child(5) { inline-size: 62%; margin-block-end: 0; }

  .main {
    flex: 1;
    padding: 0.9rem;
  }

  .crumbs {
    margin-block-end: 1rem;
    padding: 0.65rem 0.7rem;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #fff;
    font-size: 0.83rem;
    font-weight: 500;
  }

  .panel[dir="rtl"] .crumbs {
    text-align: end;
  }

  .crumb-current {
    font-weight: 700;
  }

  .line {
    inline-size: 100%;
  }

  .line.short { inline-size: 66%; }
  .line.med { inline-size: 84%; }
  .line:last-child { margin-block-end: 0; }

  .panel[dir="rtl"] .line {
    margin-inline-start: auto;
  }

  @media (max-width: 760px) {
    .figure {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>
<main>
  <h1>Mirrored LTR and RTL layout</h1>
  <p class="intro"></p>

  <div class="figure">
    <section class="panel" dir="ltr" aria-labelledby="ltr-title">
      <div class="panel-title">
        <span id="ltr-title">LTR interface</span>
      </div>
      <div class="edge-note">
        <span>Start side</span>
        <span>End side</span>
      </div>

      <div class="shell">
        <div class="shell-header">
          <span class="logo">Logo</span>
          <span class="header-copy">Header content</span>
        </div>

        <div class="shell-body">
          <aside class="nav" aria-label="Navigation">
            <p class="nav-title">Navigation</p>
            <span class="nav-item"></span>
            <span class="nav-item"></span>
            <span class="nav-item"></span>
            <span class="nav-item"></span>
          </aside>

          <section class="main">
            <p class="crumb-title">Breadcrumb</p>
            <nav class="crumbs" aria-label="Breadcrumb">Home &gt; Section &gt; <span class="crumb-current">Current</span></nav>

            <p class="main-title">Main content</p>
            <span class="line"></span>
            <span class="line med"></span>
            <span class="line"></span>
            <span class="line short"></span>
          </section>
        </div>
      </div>
    </section>

    <section class="panel" dir="rtl" aria-labelledby="rtl-title">
      <div class="panel-title">
        <span id="rtl-title">RTL interface</span>
      </div>
      <div class="edge-note">
        <span>Start side</span>
        <span>End side</span>
      </div>

      <div class="shell">
        <div class="shell-header">
          <span class="logo">Logo</span>
          <span class="header-copy">Header content</span>
        </div>

        <div class="shell-body">
          <aside class="nav" aria-label="Navigation">
            <p class="nav-title">Navigation</p>
            <span class="nav-item"></span>
            <span class="nav-item"></span>
            <span class="nav-item"></span>
            <span class="nav-item"></span>
          </aside>

          <section class="main">
            <p class="crumb-title">Breadcrumb</p>
            <nav class="crumbs" aria-label="Breadcrumb" dir="ltr"><span class="crumb-current">Current</span> &lt; Section &lt; Home</nav>

            <p class="main-title">Main content</p>
            <span class="line"></span>
            <span class="line med"></span>
            <span class="line"></span>
            <span class="line short"></span>
          </section>
        </div>
      </div>
    </section>
  </div>
</main>
</body>
</html>
